name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run format:check
      - if: ${{ !cancelled() }}
        run: npm test
      # Builds first, then reads the declarations back without `@types/node`:
      # a node type in a public signature fails here and nowhere else. It
      # covers `npm run build`, which is why that is not a step of its own.
      - if: ${{ !cancelled() }}
        run: npm run check:surface
